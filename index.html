<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkliste Wärmepumpe</title>
<style>
:root{--primary:#F28C22;--text:#1F1F1F;--muted:#6b6b6b;--line:#e3e3e3;--err:#b42318;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:#f2f2f2}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:3px solid var(--primary)}
.brand{display:flex;align-items:center;gap:8px}
.brand-word{font-weight:800;font-size:20px;letter-spacing:.5px}
.top-title{font-size:15px;font-weight:700;line-height:1.2}
.top-sub{font-size:12px;color:var(--muted)}
.progress{height:6px;background:#eee}
.progress>div{height:100%;background:var(--primary);transition:width .3s}
main{padding:16px;flex:1}
h2{font-size:20px;margin:4px 0 2px}
.step-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q.invalid{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.q-label{font-size:16px;font-weight:600;line-height:1.35}
.q-hint{font-size:13px;color:var(--muted);margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
.choice{min-height:56px;font-size:17px;font-weight:600;border:2px solid #cfcfcf;border-radius:10px;background:#fff;color:var(--text);cursor:pointer;padding:0 6px}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:#fff}
input[type=text],input[type=date],textarea,select{width:100%;font-size:17px;padding:12px;border:1px solid #bdbdbd;border-radius:10px;margin-top:10px;font-family:inherit;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.calc{font-size:13px;color:#7a3e00;margin-top:6px;min-height:0}
.remark-toggle{margin-top:8px;background:none;border:none;color:#b35a00;font-weight:600;font-size:15px;padding:8px 0;cursor:pointer;text-decoration:underline}
.msg{font-size:14px;margin:8px 0 12px;padding:10px 12px;border-radius:10px;display:none}
.msg.show{display:block}
.msg.err{background:#fdecea;color:var(--err)}
.msg.warn{background:#fff4e5;color:#7a3e00}
.msg.ok{background:#ecf7ee;color:#1d5c2c}
.link{background:none;border:none;padding:4px 0;color:#7a3e00;text-decoration:underline;font-size:14px;text-align:left;cursor:pointer}
nav.nav{display:flex;gap:10px;padding:12px 16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.btn{flex:1;min-height:56px;font-size:17px;font-weight:700;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer}
.btn:disabled{background:#d9d9d9;border-color:#d9d9d9;color:#777;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--text);border-color:#bdbdbd}
.btn.ghost:disabled{background:#f5f5f5;border-color:#e0e0e0;color:#aaa}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.tools .btn{flex:none}
.sum-sec{margin-top:16px}
.sum-sec h3{font-size:15px;margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sum-row{padding:8px 0;border-bottom:1px dashed #e6e6e6;font-size:14px}
.sum-q{color:#333}
.sum-a{font-weight:700;margin-top:2px}
.sum-r{color:var(--muted);margin-top:2px;font-size:13px}
ul.miss{margin:6px 0 0;padding-left:18px}
.preview-wrap{margin-top:20px;border:1px dashed #cfcfcf;border-radius:10px;padding:10px;background:#f7f7f7;overflow-x:auto}
.preview-label{font-size:13px;color:var(--muted);margin:0 0 8px}

/* Druckansicht (A4) */
.print-doc{background:#fff;color:#1F1F1F;font-family:Arial,Helvetica,sans-serif;font-size:10pt;padding:14px 16px;min-width:0;max-width:720px;margin:0 auto;border:1px solid #e3e3e3}
.print-doc .p-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid #F28C22;padding-bottom:8px;margin-bottom:10px}
.print-doc .p-title{font-size:18pt;margin:0;color:#1F1F1F}
.print-doc .p-meta{width:100%;border-collapse:collapse;margin-bottom:8px}
.print-doc .p-meta th{text-align:left;width:28%;padding:3px 6px;background:#fdf3e7;font-weight:700;border:1px solid #e3e3e3}
.print-doc .p-meta td{padding:3px 6px;border:1px solid #e3e3e3}
.print-doc .p-sec{font-size:12pt;margin:14px 0 4px;color:#1F1F1F;border-bottom:1px solid #F28C22;padding-bottom:2px;break-after:avoid}
.print-doc .p-tab{width:100%;border-collapse:collapse;font-size:9.5pt}
.print-doc .p-tab th{background:#f2f2f2;text-align:left;padding:4px 6px;border:1px solid #cfcfcf}
.print-doc .p-tab td{padding:4px 6px;border:1px solid #cfcfcf;vertical-align:top}
.print-doc .p-tab tr{break-inside:avoid}
.print-doc .p-free{border:1px solid #e3e3e3;padding:6px;min-height:40px;white-space:pre-wrap}

@page{
  size:A4;
  margin:16mm 14mm 20mm 14mm;
  @bottom-left{content:"ELDI Elektro-Dietrich GmbH · Checkliste Wärmepumpe";font-size:9pt;color:#555}
  @bottom-right{content:"Seite " counter(page) " von " counter(pages);font-size:9pt;color:#555}
}
#printDoc{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printDoc){display:none!important}
  #printDoc{display:block!important;border:none;max-width:none;margin:0;padding:0;color:#1F1F1F;font-family:Arial,Helvetica,sans-serif;font-size:10pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="print-doc" id="printDoc"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Schema ---------- */
const ANZAHL_WP = Array.from({ length: 10 }, (_, i) => String(i + 1));

const SCHEMA = {
  header: [
    { id:'datum', label:'Datum', type:'date', required:true },
    { id:'bearbeiter', label:'Bearbeiter', type:'text', required:true, remark:true }
  ],
  blocks: [
    { id:'kunde', title:'Kundendaten', fields:[
      { id:'name', label:'Name', type:'text', required:true, remark:true },
      { id:'vorname', label:'Vorname', type:'text', required:true, remark:true },
      { id:'adresse', label:'Adresse', type:'text', required:true, hint:'Straße, Hausnummer, PLZ, Ort', remark:true },
      { id:'telefon', label:'Telefonnummer', type:'text', required:true, inputmode:'tel', remark:true },
      { id:'email', label:'E-Mail-Adresse', type:'text', required:true, inputmode:'email', remark:true },
      { id:'zaehler', label:'Zählernummer', type:'text', required:true, remark:true },
      { id:'extra_zaehler', label:'Soll ein extra Wärmepumpenzähler gesetzt werden?', type:'yes_no', required:true, remark:true }
    ]},
    { id:'wp', title:'Wärmepumpe(n)', fields:[
      { id:'anzahl_wp', label:'Wie viele Wärmepumpen sind verbaut oder sollen verbaut werden?', type:'select', options:ANZAHL_WP, required:true, remark:true },
      { id:'betriebsweise', label:'Betriebsweise', type:'select', options:['monovalent','bivalent','monoenergetisch'], required:true, remark:true },
      { id:'anzahl_gleich', label:'Anzahl der WP mit gleicher Leistung', type:'text', required:true, inputmode:'numeric', hint:'Z. B. 2, wenn zwei identische Geräte verbaut sind', remark:true },
      { id:'pel_je_wp', label:'Elektrische Anschlussleistung Pel je Wärmepumpe in kW', type:'text', required:true, inputmode:'decimal', hint:'Laut Typenschild, z. B. 3,5', remark:true },
      { id:'anlaufstrom', label:'Maximaler Anlaufstrom je WP in A', type:'text', required:true, inputmode:'decimal', hint:'Laut Datenblatt bzw. Typenschild', remark:true }
    ]},
    { id:'ergh', title:'Ergänzungsheizung', fields:[
      { id:'ergh_vorh', label:'Ist eine Ergänzungsheizung vorhanden?', type:'yes_no', required:true, remark:true },
      { id:'ergh_art', label:'Ergänzungsheizung für', type:'select', options:['Warmwasserversorgung','Raumheizung','Warmwasser und Raumheizung'], required:true, remark:true, visibleIf:{ field:'ergh_vorh', equals:'yes' } },
      { id:'ergh_kw', label:'Nennleistung Pel der elektrischen Ergänzungsheizung in kW', type:'text', required:true, inputmode:'decimal', hint:'Elektrische Anschlussleistung der Heizstäbe, z. B. 3', remark:true, visibleIf:{ field:'ergh_vorh', equals:'yes' } }
    ]},
    { id:'gesamt', title:'Gesamtleistung Wärmepumpenanlage', fields:[
      { id:'pel_gesamt', label:'Gesamtleistung Pel der Wärmepumpenanlage in kW', type:'text', required:true, inputmode:'decimal', hint:'Inklusive Ergänzungsheizung, falls vorhanden', calc:true, remark:true }
    ]},
    { id:'abschluss', title:'Bemerkung gesamt', fields:[
      { id:'bemerkung_gesamt', label:'Bemerkung', type:'textarea', required:false }
    ]}
  ]
};

/* ---------- Zustand (nur im Speicher) ---------- */
/* ---------- Versand-Einstellungen ---------- */
const RECIPIENT = 'philipp.pracht@eldi-stuttgart.de';
// URL des Empfangs-Workflows (Webhook). Leer lassen = nur PDF-Download, kein Versand.
const SEND_WEBHOOK_URL = '';

const state = { step:0, values:{}, remarks:{}, remarkOpen:{}, showErrors:false, msg:null, draftDecided:false, sending:false, sent:false };

/* ---------- Entwurf im Browser (localStorage, nur auf diesem Gerät) ---------- */
const DRAFT_KEY = 'eldi-checkliste-waermepumpe-entwurf';
function saveDraft(){
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt:new Date().toISOString(), values:state.values, remarks:state.remarks, remarkOpen:state.remarkOpen }));
    return true;
  } catch (e) { return false; }
}
function getStoredDraft(){
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; }
}
function clearStoredDraft(){
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}
function saveDraftManual(){
  const ok = saveDraft();
  state.msg = ok ? 'Entwurf auf diesem Gerät gespeichert.' : 'Speichern im Browser ist nicht möglich. Bitte Entwurf als Datei speichern.';
  render();
}
function draftBanner(){
  const d = getStoredDraft();
  const box = el('div', { class:'msg warn show' });
  const when = d && d.savedAt ? new Date(d.savedAt).toLocaleString('de-DE') : '';
  box.appendChild(el('div', null, 'Auf diesem Gerät liegt ein gespeicherter Entwurf' + (when ? ' vom ' + when : '') + '.'));
  const row = el('div', { class:'tools' });
  const go = el('button', { type:'button', class:'btn' }, 'Entwurf fortsetzen');
  go.onclick = () => {
    if (d) { state.values = d.values || {}; state.remarks = d.remarks || {}; state.remarkOpen = d.remarkOpen || {}; }
    state.draftDecided = true; state.msg = 'Entwurf geladen.'; render();
  };
  const no = el('button', { type:'button', class:'btn ghost' }, 'Verwerfen und neu beginnen');
  no.onclick = () => {
    clearStoredDraft();
    state.values = {}; state.remarks = {}; state.remarkOpen = {};
    state.draftDecided = true; state.msg = 'Gespeicherter Entwurf verworfen.'; render();
  };
  row.appendChild(go);
  row.appendChild(no);
  box.appendChild(row);
  return box;
}

/* ---------- Hilfsfunktionen ---------- */
function el(tag, attrs, text){
  const n = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    if (attrs[k] === undefined || attrs[k] === null) continue;
    n.setAttribute(k, String(attrs[k]));
  }
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function condOk(c){
  if (!c) return true;
  if (c.any) return c.any.some(condOk);
  if (c.all) return c.all.every(condOk);
  return state.values[c.field] === c.equals;
}
function isVisible(x){ return condOk(x.visibleIf); }
function hasValue(f){
  const v = state.values[f.id];
  if (f.type === 'yes_no') return v === 'yes' || v === 'no';
  return typeof v === 'string' && v.trim() !== '';
}
function missingIn(fields){ return fields.filter(f => f.required && !hasValue(f)); }
function parseNum(s){
  if (typeof s !== 'string') return NaN;
  return parseFloat(s.trim().replace(',', '.'));
}
function fmtNum(n){ return n.toLocaleString('de-DE', { maximumFractionDigits:2 }); }
function calcSuggestion(){
  const n = parseInt(state.values.anzahl_wp, 10);
  const p = parseNum(state.values.pel_je_wp);
  if (!n || isNaN(p)) return null;
  let ergh = 0;
  if (state.values.ergh_vorh === 'yes') {
    ergh = parseNum(state.values.ergh_kw);
    if (isNaN(ergh)) return null;
  }
  const wp = Math.round(n * p * 100) / 100;
  const total = Math.round((n * p + ergh) * 100) / 100;
  return { n, p, wp, ergh, total, hasErgh: state.values.ergh_vorh === 'yes' };
}
function calcText(){
  const s = calcSuggestion();
  if (!s) return 'Vorschlag: Anzahl WP, Pel je WP' + (state.values.ergh_vorh === 'yes' ? ' und Nennleistung der Ergänzungsheizung' : '') + ' eintragen, dann wird die Gesamtleistung berechnet.';
  let text = 'Vorschlag: ' + s.n + ' × ' + fmtNum(s.p) + ' kW = ' + fmtNum(s.wp) + ' kW';
  if (s.hasErgh) text += ' + ' + fmtNum(s.ergh) + ' kW Ergänzungsheizung';
  return text + ' = ' + fmtNum(s.total) + ' kW (bei unterschiedlichen WP-Typen bitte manuell korrigieren).';
}
function applySuggestion(){
  const s = calcSuggestion();
  if (!s) return;
  state.values.pel_gesamt = fmtNum(s.total);
  saveDraft();
  render();
}
function updateCalc(){
  document.querySelectorAll('[data-calc]').forEach(node => { node.textContent = calcText(); });
}
function answerText(f){
  const v = state.values[f.id];
  if (f.type === 'yes_no') {
    if (v === 'yes') return 'Ja';
    if (v === 'no') return 'Nein';
    return 'Nicht beantwortet';
  }
  if (!v || (typeof v === 'string' && !v.trim())) return 'Nicht angegeben';
  if (f.id === 'pel_gesamt' && !v) return 'Nicht angegeben';
  return v;
}
function checkMarks(f){
  const v = state.values[f.id];
  return [['yes','Ja'],['no','Nein']].map(([k,t]) => (v === k ? '☒' : '☐') + ' ' + t).join('   ');
}
function brandMark(h){
  const wrap = el('div', { class:'brand' });
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox','0 0 100 100');
  s.setAttribute('width', h); s.setAttribute('height', h);
  s.setAttribute('role','img'); s.setAttribute('aria-label','ELDI Logo');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d','M58 4 L22 56 H44 L36 96 L78 40 H56 L70 4 Z');
  p.setAttribute('fill','#F28C22');
  s.appendChild(p);
  wrap.appendChild(s);
  wrap.appendChild(el('span', { class:'brand-word' }, 'ELDI'));
  return wrap;
}
function getSteps(){
  const steps = [{ kind:'header', title:'Kopfdaten', fields:SCHEMA.header }];
  SCHEMA.blocks.forEach(b => {
    if (isVisible(b)) steps.push({ kind:'block', title:b.title, fields:b.fields.filter(isVisible) });
  });
  steps.push({ kind:'summary' });
  return steps;
}

/* ---------- Feld-Rendering ---------- */
function renderField(f){
  const invalid = state.showErrors && f.required && !hasValue(f);
  const wrap = el('div', { class:'q' + (invalid ? ' invalid' : ''), 'data-id': f.id });
  wrap.appendChild(el('div', { class:'q-label' }, f.label));
  if (f.hint) wrap.appendChild(el('div', { class:'q-hint' }, f.hint));

  if (f.type === 'yes_no') {
    const grp = el('div', { class:'choices', role:'group', 'aria-label': f.label });
    [['yes','Ja'],['no','Nein']].forEach(([val, txt]) => {
      const b = el('button', { type:'button', class:'choice', 'aria-pressed': String(state.values[f.id] === val) }, txt);
      b.onclick = () => { state.values[f.id] = val; saveDraft(); render(); };
      grp.appendChild(b);
    });
    wrap.appendChild(grp);
  } else if (f.type === 'text' || f.type === 'date') {
    const inp = el('input', { type: f.type === 'date' ? 'date' : 'text', 'aria-label': f.label, inputmode: f.inputmode || null });
    inp.value = state.values[f.id] || '';
    inp.oninput = () => { state.values[f.id] = inp.value; saveDraft(); updateCalc(); };
    wrap.appendChild(inp);
    if (f.calc) {
      const c = el('div', { class:'calc' });
      c.appendChild(el('span', { 'data-calc':'1' }, calcText()));
      const use = el('button', { type:'button', class:'btn ghost', style:'margin-top:10px;min-height:48px;width:100%' }, 'Vorschlag übernehmen');
      use.onclick = applySuggestion;
      c.appendChild(use);
      wrap.appendChild(c);
    }
  } else if (f.type === 'select') {
    const sel = el('select', { 'aria-label': f.label });
    sel.appendChild(el('option', { value:'' }, 'Bitte wählen'));
    (f.options || []).forEach(o => sel.appendChild(el('option', { value:o }, o)));
    sel.value = state.values[f.id] || '';
    sel.onchange = () => { state.values[f.id] = sel.value; saveDraft(); render(); };
    wrap.appendChild(sel);
  } else if (f.type === 'textarea') {
    const ta = el('textarea', { 'aria-label': f.label });
    ta.value = state.values[f.id] || '';
    ta.oninput = () => { state.values[f.id] = ta.value; saveDraft(); };
    wrap.appendChild(ta);
  }

  if (f.remark) {
    const open = state.remarkOpen[f.id] || !!state.remarks[f.id];
    if (open) {
      const ta = el('textarea', { 'aria-label': 'Bemerkung zu ' + f.label, placeholder:'Bemerkung' });
      ta.value = state.remarks[f.id] || '';
      ta.oninput = () => { state.remarks[f.id] = ta.value; saveDraft(); };
      wrap.appendChild(ta);
    } else {
      const b = el('button', { type:'button', class:'remark-toggle' }, '+ Bemerkung hinzufügen');
      b.onclick = () => { state.remarkOpen[f.id] = true; render(); };
      wrap.appendChild(b);
    }
  }
  return wrap;
}

/* ---------- Zusammenfassung und Vorschau ---------- */
function renderSummary(main, steps){
  main.appendChild(el('h2', null, 'Zusammenfassung'));
  const missing = [];
  steps.forEach((s, i) => {
    if (s.kind === 'summary') return;
    missingIn(s.fields).forEach(f => missing.push({ f, idx:i, title:s.title }));
  });
  if (missing.length) {
    const box = el('div', { class:'msg warn show' });
    box.appendChild(el('strong', null, missing.length + ' Pflichtangabe(n) fehlen:'));
    const ul = el('ul', { class:'miss' });
    missing.forEach(m => {
      const li = el('li');
      const b = el('button', { type:'button', class:'link' }, m.f.label + ' (' + m.title + ')');
      b.onclick = () => { state.step = m.idx; state.showErrors = true; render(); };
      li.appendChild(b);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    main.appendChild(box);
  } else {
    main.appendChild(el('div', { class:'msg ok show' }, 'Alle Pflichtangaben sind ausgefüllt.'));
  }

  steps.forEach(s => {
    if (s.kind === 'summary') return;
    const sec = el('section', { class:'sum-sec' });
    sec.appendChild(el('h3', null, s.title));
    s.fields.forEach(f => {
      const row = el('div', { class:'sum-row' });
      row.appendChild(el('div', { class:'sum-q' }, f.label));
      row.appendChild(el('div', { class:'sum-a' }, answerText(f)));
      if (state.remarks[f.id]) row.appendChild(el('div', { class:'sum-r' }, 'Bemerkung: ' + state.remarks[f.id]));
      sec.appendChild(row);
    });
    main.appendChild(sec);
  });

  main.appendChild(el('h2', { style:'margin-top:24px' }, 'Vorschau'));
  main.appendChild(el('p', { class:'preview-label' }, 'So sieht das ausgedruckte A4-Dokument aus. Zum Drucken oder Speichern als PDF den Button unten nutzen.'));
  const wrap = el('div', { class:'preview-wrap' });
  const doc = el('div', { class:'print-doc' });
  wrap.appendChild(doc);
  main.appendChild(wrap);
  buildPrintDoc(doc, steps);

  const tools = el('div', { class:'tools' });
  const bx = el('button', { type:'button', class:'btn ghost' }, 'Entwurf als Datei speichern');
  bx.onclick = exportDraft;
  const bn = el('button', { type:'button', class:'btn ghost' }, 'Neu beginnen');
  bn.onclick = resetDraft;
  tools.appendChild(bx);
  tools.appendChild(bn);
  const printBtn = el('button', { type:'button', class:'btn ghost' }, 'Als PDF drucken (lokal)');
  printBtn.onclick = () => printDocument(steps);
  tools.appendChild(printBtn);
  tools.appendChild(importRow());
  main.appendChild(tools);
  return missing.length;
}

/* ---------- Druckansicht ---------- */
function buildPrintDoc(target, steps){
  target.innerHTML = '';
  const head = el('div', { class:'p-head' });
  head.appendChild(brandMark(44));
  const t = el('div');
  t.appendChild(el('h1', { class:'p-title' }, 'Checkliste Wärmepumpe'));
  head.appendChild(t);
  target.appendChild(head);

  const meta = el('table', { class:'p-meta' });
  SCHEMA.header.forEach(f => {
    const tr = el('tr');
    tr.appendChild(el('th', null, f.label));
    tr.appendChild(el('td', null, answerText(f)));
    meta.appendChild(tr);
  });
  target.appendChild(meta);

  steps.forEach(s => {
    if (s.kind !== 'block') return;
    target.appendChild(el('h3', { class:'p-sec' }, s.title));
    const onlyText = s.fields.every(f => f.type === 'textarea');
    if (onlyText) {
      s.fields.forEach(f => {
        const txt = answerText(f) + (state.remarks[f.id] ? '\n' + state.remarks[f.id] : '');
        target.appendChild(el('div', { class:'p-free' }, txt));
      });
      return;
    }
    const tb = el('table', { class:'p-tab' });
    const thead = el('tr');
    ['Angabe','Feld','Bemerkung'].forEach((h, i) => {
      const th = el('th', null, h);
      th.style.width = ['26%','50%','24%'][i];
      thead.appendChild(th);
    });
    tb.appendChild(thead);
    s.fields.forEach(f => {
      const tr = el('tr');
      tr.appendChild(el('td', null, f.type === 'yes_no' ? checkMarks(f) : answerText(f)));
      tr.appendChild(el('td', null, f.label + (f.hint ? ' (' + f.hint + ')' : '')));
      tr.appendChild(el('td', null, state.remarks[f.id] || ''));
      tb.appendChild(tr);
    });
    target.appendChild(tb);
  });
}

/* ---------- Entwurf als Datei ---------- */
function draftFileName(){
  const name = (state.values.name || 'ohne_Name').replace(/[^A-Za-z0-9äöüÄÖÜß-]+/g, '_').replace(/^_+|_+$/g, '') || 'ohne_Name';
  return 'Entwurf_Checkliste_Waermepumpe_' + name + '.json';
}
function exportDraft(){
  const data = JSON.stringify({ formName:'Checkliste Wärmepumpe', version:1, savedAt:new Date().toISOString(), values:state.values, remarks:state.remarks }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  a.download = draftFileName();
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function importDraft(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.values !== 'object') throw new Error('kein Entwurf');
      state.values = d.values;
      state.remarks = d.remarks || {};
      state.remarkOpen = {};
      state.step = 0;
      state.showErrors = false;
      state.draftDecided = true;
      saveDraft();
      state.msg = 'Entwurf geladen.';
      render();
    } catch (e) {
      state.msg = 'Die Datei ist kein gültiger Entwurf dieser Checkliste.';
      render();
    }
  };
  r.readAsText(file);
}
function resetDraft(){
  state.values = {}; state.remarks = {}; state.remarkOpen = {};
  clearStoredDraft();
  state.draftDecided = true;
  state.step = 0; state.showErrors = false; state.msg = 'Formular zurückgesetzt.';
  render();
}
function importRow(){
  const row = el('div', { class:'tools' });
  const lab = el('label', { class:'link', style:'cursor:pointer;display:inline-block;padding:8px 0' }, 'Gespeicherten Entwurf (.json) laden');
  const inp = el('input', { type:'file', accept:'.json,application/json', style:'display:none' });
  inp.onchange = () => { if (inp.files[0]) importDraft(inp.files[0]); };
  lab.appendChild(inp);
  row.appendChild(lab);
  return row;
}

/* ---------- PDF erzeugen und senden ---------- */
function pdfFileName(){
  const name = ((state.values.name || '') + '_' + (state.values.vorname || '')).replace(/[^A-Za-z0-9äöüÄÖÜß_-]+/g, '_').replace(/^_+|_+$/g, '') || 'ohne_Name';
  const d = (state.values.datum || new Date().toISOString().slice(0,10));
  return 'Checkliste_Waermepumpe_' + name + '_' + d + '.pdf';
}
function buildPdfDoc(steps){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 16, maxW = W - 2 * M, LIMIT = 280;
  let y = M;
  const ensure = h => { if (y + h > LIMIT) { doc.addPage(); y = M; } };
  const writeWrapped = (text, x, size, style, color) => {
    doc.setFont('helvetica', style || 'normal');
    doc.setFontSize(size);
    doc.setTextColor(...(color || [31,31,31]));
    const lines = doc.splitTextToSize(String(text), maxW - (x - M));
    const lh = size * 0.42;
    lines.forEach(line => { ensure(lh + 1); doc.text(line, x, y + size * 0.35); y += lh + 1; });
  };

  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(31,31,31);
  doc.text('Checkliste Wärmepumpe', M, y + 6); y += 11;
  doc.setDrawColor(242,140,34); doc.setLineWidth(0.9); doc.line(M, y, W - M, y); y += 6;

  SCHEMA.header.forEach(f => { writeWrapped(f.label + ': ' + answerText(f), M, 10, 'normal'); });
  y += 2;

  steps.forEach(s => {
    if (s.kind !== 'block') return;
    ensure(14);
    y += 3;
    writeWrapped(s.title, M, 12, 'bold');
    doc.setDrawColor(242,140,34); doc.setLineWidth(0.4); doc.line(M, y, W - M, y); y += 3;
    s.fields.forEach(f => {
      ensure(12);
      writeWrapped(f.label, M + 2, 9, 'normal', [90,90,90]);
      writeWrapped(answerText(f), M + 4, 10, 'bold');
      if (state.remarks[f.id]) writeWrapped('Bemerkung: ' + state.remarks[f.id], M + 4, 9, 'italic', [90,90,90]);
      y += 1.5;
    });
  });

  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(85,85,85);
    doc.text('ELDI Elektro-Dietrich GmbH · Checkliste Wärmepumpe', M, 290);
    doc.text('Seite ' + i + ' von ' + pages, W - M, 290, { align:'right' });
  }
  return doc;
}
function printDocument(steps){
  buildPrintDoc(document.getElementById('printDoc'), steps);
  let blocked = false;
  try { window.print(); } catch (e) { blocked = true; }
  state.msg = blocked
    ? 'Der Druckdialog ist in dieser Vorschau gesperrt. Bitte die Datei direkt im Browser öffnen und dort mit Strg+P als PDF speichern.'
    : 'Erscheint kein Druckdialog? Dann die Datei direkt im Browser öffnen und dort mit Strg+P als PDF speichern.';
  render();
}
function sendPdf(steps){
  if (state.sending || state.sent) return;
  let doc;
  try { doc = buildPdfDoc(steps); } catch (e) {
    state.msg = 'Die PDF konnte nicht erstellt werden. Bitte die Seite neu laden und es erneut versuchen.';
    render(); return;
  }
  const filename = pdfFileName();
  const kunde = (state.values.vorname || '') + ' ' + (state.values.name || '');
  if (!SEND_WEBHOOK_URL) {
    doc.save(filename);
    state.msg = 'Der automatische Versand ist noch nicht eingerichtet. Die PDF wurde heruntergeladen und bitte an ' + RECIPIENT + ' gesendet.';
    render(); return;
  }
  state.sending = true;
  state.msg = null;
  render();
  const payload = {
    to: RECIPIENT,
    subject: 'Checkliste Wärmepumpe - ' + kunde.trim(),
    body: 'Im Anhang finden Sie die ausgefüllte Checkliste Wärmepumpe' + (kunde.trim() ? ' für ' + kunde.trim() : '') + '.',
    filename,
    pdfBase64: doc.output('datauristring').split(',')[1]
  };
  fetch(SEND_WEBHOOK_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); state.sent = true; clearStoredDraft(); state.msg = 'Die Checkliste wurde an ' + RECIPIENT + ' gesendet.'; })
    .catch(() => { doc.save(filename); state.msg = 'Der Versand ist fehlgeschlagen. Die PDF wurde stattdessen heruntergeladen; bitte an ' + RECIPIENT + ' senden.'; })
    .finally(() => { state.sending = false; render(); });
}

/* ---------- Hauptrendering ---------- */
function render(){
  const steps = getSteps();
  if (state.step > steps.length - 1) state.step = steps.length - 1;
  const cur = steps[state.step];
  const total = steps.length - 1;
  const app = document.getElementById('app');
  app.innerHTML = '';

  const top = el('header', { class:'top' });
  top.appendChild(brandMark(34));
  const tt = el('div');
  tt.appendChild(el('div', { class:'top-title' }, 'Checkliste Wärmepumpe'));
  tt.appendChild(el('div', { class:'top-sub' }, 'ELDI Elektro-Dietrich GmbH'));
  top.appendChild(tt);
  const saveBtn = el('button', { type:'button', class:'link', style:'margin-left:auto' }, 'Entwurf speichern');
  saveBtn.onclick = saveDraftManual;
  top.appendChild(saveBtn);
  app.appendChild(top);

  const pct = Math.round(state.step / total * 100);
  const pr = el('div', { class:'progress', role:'progressbar', 'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':String(pct) });
  const bar = el('div');
  bar.style.width = pct + '%';
  pr.appendChild(bar);
  app.appendChild(pr);

  const main = el('main');
  if (state.msg) main.appendChild(el('div', { class:'msg ok show' }, state.msg));
  if (!state.draftDecided && getStoredDraft()) main.appendChild(draftBanner());

  if (cur.kind === 'summary') {
    renderSummary(main, steps);
  } else {
    main.appendChild(el('h2', null, cur.title));
    main.appendChild(el('div', { class:'step-sub' }, 'Schritt ' + (state.step + 1) + ' von ' + total));
    cur.fields.forEach(f => main.appendChild(renderField(f)));
    const miss = missingIn(cur.fields);
    main.appendChild(el('div', { class:'msg err' + (state.showErrors && miss.length ? ' show' : ''), role:'alert' }, 'Bitte noch ' + miss.length + ' Pflichtfeld(er) ausfüllen.'));
  }
  app.appendChild(main);

  const nav = el('nav', { class:'nav' });
  const back = el('button', { type:'button', class:'btn ghost' }, 'Zurück');
  back.disabled = state.step === 0;
  back.onclick = () => { state.step--; state.showErrors = false; state.msg = null; window.scrollTo(0,0); render(); };
  nav.appendChild(back);

  if (cur.kind === 'summary') {
    const missCount = steps.slice(0, -1).reduce((n, s) => n + missingIn(s.fields).length, 0);
    const pdf = el('button', { type:'button', class:'btn' }, state.sending ? 'Wird gesendet …' : (state.sent ? 'Gesendet' : 'Fertig und senden'));
    pdf.disabled = missCount > 0 || state.sending || state.sent;
    pdf.onclick = () => sendPdf(steps);
    nav.appendChild(pdf);
  } else {
    const next = el('button', { type:'button', class:'btn' }, 'Weiter');
    next.onclick = () => {
      const miss = missingIn(cur.fields);
      if (miss.length) { state.showErrors = true; render(); return; }
      state.showErrors = false;
      state.msg = null;
      state.step++;
      window.scrollTo(0,0);
      render();
    };
    nav.appendChild(next);
  }
  app.appendChild(nav);
}

render();
</script>
